<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#06202c"/>
      <stop offset="1" stop-color="#01060c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9af4ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#00e5ff" filter="url(#glow)">
    <circle cx="256" cy="256" r="150" stroke-width="16" stroke="#bff8ff"/>
    <circle cx="256" cy="256" r="118" stroke-width="3" opacity="0.55"/>
    <circle cx="256" cy="256" r="84" stroke-width="10"/>
    <circle cx="256" cy="256" r="182" stroke-width="3" stroke-dasharray="4 20" opacity="0.6"/>
  </g>
  <circle cx="256" cy="256" r="62" fill="url(#core)"/>
</svg>
